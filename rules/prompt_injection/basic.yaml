# Basic prompt injection detection rules
- id: ADR-PI-001
  name: Ignore Instructions
  description: Attempts to override system instructions (escalated to Tier 2 for context analysis)
  category: prompt_injection
  patterns:
    - 'ignore\s+(all\s+)?(previous|prior|above)\s+instructions?'
    - 'disregard\s+(all\s+)?(previous|prior|above)'
    - 'forget\s+(all\s+)?(previous|prior|above|your)\s+(instructions?|rules?|guidelines?)'
  severity: medium
  action: ask
  tags: ["jailbreak", "instruction_override", "tier2_escalate"]

- id: ADR-PI-002
  name: Role Hijacking (DAN)
  description: Attempts to change AI persona to bypass restrictions
  category: prompt_injection
  patterns:
    - 'you\s+are\s+now\s+(DAN|a\s+different|an?\s+unrestricted)'
    - 'act\s+as\s+(if\s+you\s+have\s+no|DAN|an?\s+evil)'
    - 'pretend\s+(to\s+be|you\s+are)\s+(DAN|evil|unrestricted)'
    - 'developer\s+mode\s+(enabled|activated|on)'
  severity: high
  action: block
  tags: ["jailbreak", "DAN", "role_play"]

- id: ADR-PI-003
  name: Prompt Leaking
  description: Attempts to extract system prompt
  category: prompt_injection
  patterns:
    - 'repeat\s+(the|your)\s+(words?|text|instructions?)\s+above'
    - 'show\s+(me\s+)?(your|the)\s+(system\s+)?prompt'
    - 'what\s+(is|are)\s+your\s+(system\s+)?(prompt|instructions?)'
    - 'print\s+(your|the)\s+(initial|system)\s+(prompt|instructions?)'
  severity: medium
  action: ask
  tags: ["prompt_leak", "extraction"]
