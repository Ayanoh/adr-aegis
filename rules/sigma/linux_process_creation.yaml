- id: SIG-LNX-CMD-0105
  name: Mask System Power Settings Via Systemctl
  description: "Detects the use of systemctl mask to disable system power management\
    \ targets such as suspend, hibernate, or hybrid sleep.\nAdversaries may mask these\
    \ targets to prevent a system from entering sleep or shutdown states, ensuring\
    \ their malicious processes remain active and uninterrupted.\nThis behavior can\
    \ be associated with persistence or defense evasion, as it impairs normal system\
    \ power operations to maintain long-term access or avoid termination of malicious\
    \ activity.\n [source: Sigma c172b7b5-f3a1-4af2-90b7-822c63df86cb]"
  category: linux_command
  patterns:
  - (?=.*/systemctl)(?=.*\bmask\b).*(?=.*(?:suspend\.target|hibernate\.target|hybrid\-sleep\.target)).*
  severity: high
  action: block
  mitre_atlas_id: attack.t1653
  enabled: true
  tags:
  - sigma
  - attack.persistence
  - attack.impact
  - attack.t1653
