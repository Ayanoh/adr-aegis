    This could be used to masquerade parent-child relationships\n [source: Sigma ed825c86-c009-4014-b413-b76003e33d35]"
  category: windows_command
  patterns:
  - \[a\-zA\-Z\]:\\\\
  severity: medium
  action: ask
  mitre_atlas_id: attack.t1202
  enabled: true
  tags:
  - sigma
  - attack.execution
  - attack.stealth
  - attack.t1202
- id: SIG-WIN-CMD-1147
  name: Proxy Execution Via Wuauclt.EXE
  description: 'Detects the use of the Windows Update Client binary (wuauclt.exe)
    for proxy execution. [source: Sigma af77cf95-c469-471c-b6a0-946c685c4798]'
  category: windows_command
  patterns:
  - (?=.*(?:\\wuauclt\.exe|wuauclt\.exe))(?=.*UpdateDeploymentProvider)(?=.*RunHandlerComServer)(?=.*/UpdateDeploymentProvider\
    UpdateDeploymentProvider\.dll)(?=.*wuaueng\.dll)(?=.*(?::\\Windows\\UUS\\Packages\\Preview\\amd64\\updatedeploy\.dll\
    /ClassId|:\\Windows\\UUS\\amd64\\UpdateDeploy\.dll\ /ClassId))(?=.*:\\Windows\\WinSxS\\)(?=.*\\UpdateDeploy\.dll\
    /ClassId).*
  severity: high
  action: block
  mitre_atlas_id: attack.t1218
  enabled: true
  tags:
  - sigma
  - attack.stealth
  - attack.t1218
  - attack.execution
- id: SIG-WIN-CMD-1148
  name: Suspicious Windows Update Agent Empty Cmdline
  description: "Detects suspicious Windows Update Agent activity in which a wuauclt.exe\
    \ process command line doesn't contain any command line flags\n [source: Sigma\
    \ 52d097e2-063e-4c9c-8fbb-855c8948d135]"
  category: windows_command
  patterns:
  - (?=.*(?:\\Wuauclt\.exe|Wuauclt\.exe))(?=.*(?:\bWuauclt\b|Wuauclt\.exe)).*
  severity: high
  action: block
  mitre_atlas_id: attack.t1036
  enabled: true
  tags:
  - sigma
  - attack.stealth
  - attack.t1036
- id: SIG-WIN-CMD-1149
  name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
  description: "Detects the execution of the \"wusa.exe\" (Windows Update Standalone\
    \ Installer) utility to extract \".cab\" files using the \"/extract\" argument\
    \ from potentially suspicious paths.\n [source: Sigma c74c0390-3e20-41fd-a69a-128f0275a5ea]"
  category: windows_command
  patterns:
  - (?=.*\\wusa\.exe)(?=.*/extract:).*(?=.*(?::\\PerfLogs\\|:\\Users\\Public\\|:\\Windows\\Temp\\|\\Appdata\\Local\\Temp\\)).*
  severity: high
  action: block
  mitre_atlas_id: null
  enabled: true
  tags:
  - sigma
  - attack.execution
- id: SIG-WIN-CMD-1150
  name: Wusa.EXE Executed By Parent Process Located In Suspicious Location
  description: "Detects execution of the \"wusa.exe\" (Windows Update Standalone Installer)\
    \ utility by a parent process that is located in a suspicious location.\nAttackers\
    \ could instantiate an instance of \"wusa.exe\" in order to bypass User Account\
    \ Control (UAC). They can duplicate the access token from \"wusa.exe\" to gain\
    \ elevated privileges.\n [source: Sigma ef64fc9c-a45e-43cc-8fd8-7d75d73b4c99]"
  category: windows_command
  patterns:
  - \\wusa\.exe
  - \.msu
  severity: high
  action: block
  mitre_atlas_id: null
  enabled: true
  tags:
  - sigma
  - attack.execution
- id: SIG-WIN-CMD-1151
  name: Xwizard.EXE Execution From Non-Default Location
  description: "Detects the execution of Xwizard tool from a non-default directory.\n\
    When executed from a non-default directory, this utility can be abused in order\
    \ to side load a custom version of \"xwizards.dll\".\n [source: Sigma 193d5ccd-6f59-40c6-b5b0-8e32d5ddd3d1]"
  category: windows_command
  patterns:
  - \\xwizard\.exe
  - xwizard\.exe
  - (?:C:\\Windows\\System32\\|C:\\Windows\\SysWOW64\\|C:\\Windows\\WinSxS\\)
  severity: high
  action: block
  mitre_atlas_id: attack.t1574.001
  enabled: true
  tags:
  - sigma
  - attack.privilege-escalation
  - attack.persistence
  - attack.execution
  - attack.stealth
  - attack.t1574.001
- id: SIG-WIN-CMD-1152
  name: COM Object Execution via Xwizard.EXE
  description: "Detects the execution of Xwizard tool with the \"RunWizard\" flag\
    \ and a GUID like argument.\nThis utility can be abused in order to run custom\
