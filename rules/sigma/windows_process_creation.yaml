- id: SIG-WIN-CMD-0911
  name: ETW Trace Evasion Activity
  description: "Detects command line activity that tries to clear or disable any ETW\
    \ trace log which could be a sign of logging evasion.\n [source: Sigma a238b5d0-ce2d-4414-a676-7a531b3d13d6]"
