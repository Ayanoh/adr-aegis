  - attack.discovery
  - attack.t1012
- id: SIG-WIN-CMD-1129
  name: Registry Manipulation via WMI Stdregprov
  description: "Detects the usage of wmic.exe to modify Windows registry via the WMI\
    \ StdRegProv class write methods (CreateKey, DeleteKey, SetStringValue, etc.).\n\
    This behaviour could be potentially suspicious because it uses an alternative\
    \ method to modify registry keys instead of legitimate registry tools like reg.exe\
    \ or regedit.exe.\nAttackers specifically choose this technique to evade detection\
    \ and bypass security monitoring focused on traditional registry modification\
    \ commands.\n [source: Sigma c453ab7a-1f5c-4716-a3b4-dea8135fb43a]"
  category: windows_command
  patterns:
  - (?=.*(?:\\wmic\.exe|wmic\.exe))(?=.*stdregprov)(?=.*call)(?=.*(?:\bCreateKey\b|\bDeleteKey\b|\bDeleteValue\b|\bSetBinaryValue\b|\bSetDWORDValue\b|\bSetExpandedStringValue\b|\bSetMultiStringValue\b|\bSetQWORDValue\b|\bSetSecurityDescriptor\b|\bSetStringValue\b)).*.*
  severity: medium
  action: ask
