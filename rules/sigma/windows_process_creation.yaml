  description: "BITS will allow you to schedule a command to execute after a successful\
    \ download to notify you that the job is finished.\nWhen the job runs on the system\
    \ the command specified in the BITS job will be executed.\nThis can be abused\
    \ by actors to create a backdoor within the system and for persistence.\nIt will\
    \ be chained in a BITS job to schedule the download of malware/additional binaries\
    \ and execute the program after being downloaded.\n [source: Sigma b9cbbc17-d00d-4e3d-a827-b06d03d2380d]"
  category: windows_command
  patterns:
  - (?=.*(?:\\bitsadmin\.exe|bitsadmin\.exe))(?=.*/SetNotifyCmdLine)(?=.*(?:%COMSPEC%|cmd\.exe|regsvr32\.exe))(?=.*/Addfile)(?=.*(?:http:|https:|ftp:|ftps:)).*
