- id: SIG-WIN-CMD-0926
  name: Suspicious LNK Command-Line Padding with Whitespace Characters
  description: "Detects exploitation of LNK file command-line length discrepancy,\
    \ where attackers hide malicious commands beyond the 260-character UI limit while\
    \ the actual command-line argument field supports 4096 characters using whitespace\
    \ padding (e.g., 0x20, 0x09-0x0D).\nAdversaries insert non-printable whitespace\
    \ characters (e.g., Line Feed \\x0A, Carriage Return \\x0D) to pad the visible\
    \ section of the LNK file, pushing malicious commands past the UI-visible boundary.\n\
    The hidden payload, executed at runtime but invisible in Windows Explorer properties,\
    \ enables stealthy execution and evasion—commonly used for social engineering\
    \ attacks.\nThis rule flags suspicious use of such padding observed in real-world\
    \ attacks.\n [source: Sigma dd8756e7-a3a0-4768-b47e-8f545d1a751c]"
  category: windows_command
  patterns:
  - (?:\\u0009|\\u000A|\\u0011|\\u0012|\\u0013|\\u000B|\\u000C|\\u000D)
  - \\n\\n\\n\\n\\n\\n
  severity: high
  action: block
  mitre_atlas_id: attack.t1204.002
  enabled: true
  tags:
  - sigma
  - attack.initial-access
  - attack.execution
  - attack.t1204.002
