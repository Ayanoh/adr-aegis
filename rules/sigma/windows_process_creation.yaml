- id: SIG-WIN-CMD-0339
  name: Uncommon Link.EXE Parent Process
  description: "Detects an uncommon parent process of \"LINK.EXE\".\nLink.EXE in Microsoft\
    \ incremental linker. Its a utility usually bundled with Visual Studio installation.\n\
    Multiple utilities often found in the same folder (editbin.exe, dumpbin.exe, lib.exe,\
    \ etc) have a hardcode call to the \"LINK.EXE\" binary without checking its validity.\n\
    This would allow an attacker to sideload any binary with the name \"link.exe\"\
    \ if one of the aforementioned tools get executed from a different location.\n\
    By filtering the known locations of such utilities we can spot uncommon parent\
    \ process of LINK.EXE that might be suspicious or malicious.\n [source: Sigma\
    \ 6e968eb1-5f05-4dac-94e9-fd0c5cb49fd6]"
  category: windows_command
