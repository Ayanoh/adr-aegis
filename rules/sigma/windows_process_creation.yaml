    \ class that\nautomatically executes a predefined script (in VBScript or JScript)\
    \ whenever a specific system event occurs.\nAdversaries often abuse script event\
    \ consumers to maintain persistence on a compromised host\nby executing a malicious\
    \ script whenever a specific event occurs.\n [source: Sigma ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e]"
