  patterns:
  - (?=.*(?:\\wevtutil\.exe|wevtutil\.exe))(?=.*(?:clear\-log|set\-log|lfn:))(?=.*(?:\\powershell\.exe|\\powershell_ise\.exe|\\pwsh\.exe))(?=.*(?:(?:Clear\-EventLog|Remove\-EventLog|Limit\-EventLog|Clear\-WinEvent)|(?=.*Eventing\.Reader\.EventLogSession)(?=.*ClearLog)|(?=.*Diagnostics\.EventLog)(?=.*Clear)))(?=.*(?:\\powershell\.exe|\\powershell_ise\.exe|\\pwsh\.exe|\\wmic\.exe))(?=.*\bClearEventLog\b).*.*
  severity: high
  action: block
