- id: SIG-WIN-CMD-1127
  name: Potential Remote SquiblyTwo Technique Execution
  description: "Detects potential execution of the SquiblyTwo technique that leverages\
    \ Windows Management Instrumentation (WMI)\nto execute malicious code remotely.\
    \ This technique bypasses application whitelisting by using wmic.exe to process\n\
    malicious XSL (eXtensible Stylesheet Language) scripts that can contain embedded\
    \ JScript or VBScript.\nThe attack typically works by fetching XSL content from\
    \ a remote source (using HTTP/HTTPS) and executing it\nwith full trust privileges\
    \ directly in memory, avoiding disk-based detection mechanisms. This is a common\n\
    LOLBin (Living Off The Land Binary) technique used for defense evasion and code\
    \ execution.\n [source: Sigma 8d63dadf-b91b-4187-87b6-34a1114577ea]"
  category: windows_command
  patterns:
  - (?=.*(?:\\wmic\.exe|wmic\.exe))(?=.*/format:)(?=.*(?:://|\\\\\\\\)).*.*
  severity: high
  action: block
  mitre_atlas_id: attack.t1047
  enabled: true
  tags:
