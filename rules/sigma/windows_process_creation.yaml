- id: SIG-WIN-CMD-0114
  name: Windows Credential Guard Registry Tampering Via CommandLine
  description: "Detects attempts to add, modify, or delete Windows Credential Guard\
    \ related registry keys or values via command line tools such as Reg.exe or PowerShell.\n\
    Credential Guard uses virtualization-based security to isolate secrets so that\
    \ only privileged system software can access them.\nAdversaries may disable Credential\
    \ Guard to gain access to sensitive credentials stored in the system, such as\
    \ NTLM hashes and Kerberos tickets, which can be used for lateral movement and\
    \ privilege escalation.\nThe rule matches suspicious command lines that target\
    \ DeviceGuard or LSA registry paths and manipulate keys like EnableVirtualizationBasedSecurity,\
    \ RequirePlatformSecurityFeatures, or LsaCfgFlags.\nSuch activity may indicate\
    \ an attempt to disable or tamper with Credential Guard, potentially exposing\
    \ sensitive credentials for misuse.\n [source: Sigma c17d47b7-dcd6-4109-87eb-d1817bd4cbc9]"
  category: windows_command
  patterns:
  - (?=.*(?:(?:\\powershell\.exe|\\pwsh\.exe|\\reg\.exe)|(?:PowerShell\.EXE|pwsh\.dll|reg\.exe)))(?=.*(?:New\-ItemProperty|Set\-ItemProperty|\bdelete\b|Remove\-ItemProperty))(?=.*(?:\\Control\\DeviceGuard|\\Control\\LSA|Software\\Policies\\Microsoft\\Windows\\DeviceGuard))(?=.*(?:\bEnableVirtualizationBasedSecurity\b|\bRequirePlatformSecurityFeatures\b|\bLsaCfgFlags\b)).*
  severity: high
  action: block
  mitre_atlas_id: attack.t1685
  enabled: true
  tags:
  - sigma
  - attack.defense-impairment
  - attack.t1685
