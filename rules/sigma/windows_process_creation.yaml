- id: SIG-WIN-CMD-0912
  name: Suspicious Eventlog Clearing or Configuration Change Activity
  description: "Detects the clearing or configuration tampering of EventLog using\
    \ utilities such as \"wevtutil\", \"powershell\" and \"wmic\".\nThis technique\
    \ were seen used by threat actors and ransomware strains in order to evade defenses.\n\
    \ [source: Sigma cc36992a-4671-4f21-a91d-6c2b72a2edf5]"
