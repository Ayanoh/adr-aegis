- id: SIG-WIN-CMD-0128
  name: NTLM Hash Leak Via Curl NTLM Authentication
  description: "Detects the use of curl with NTLM authentication and empty credentials\
    \ (-u :), which can be abused to leak the currently logged-in user's NTLMv2 challenge-response\
    \ to an\nattacker-controlled server, enabling offline cracking or relay attacks.\n\
    When no credentials are provided, the Microsoft-shipped curl passes a NULL identity\
    \ to Windows SSPI, which automatically falls back to the current user's logon\
    \ session credentials\nstored in LSASS — without requiring a plaintext password.\n\
    This behavior is exclusive to the curl binary shipped by Microsoft (available\
    \ since Windows 10 / Windows Server 2019), which is built with SSPI support.\n\
    \ [source: Sigma 916eb839-895e-47f8-99ee-3008bf377a3e]"
  category: windows_command
  patterns:
  - (?=.*(?:\\curl\.exe|curl\.exe))(?=.*\-\-ntlm)(?=.*\(.i\)\\s\(\-u\|\-\-user\)\\s.*:).*
  severity: high
  action: block
  mitre_atlas_id: attack.t1187
  enabled: true
  tags:
  - sigma
