- id: SIG-WIN-CMD-0333
  name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
  description: "Detects the presence of \"UWhRC....AAYBAAAA\" pattern in command line.\n\
    The pattern \"1UWhRCAAAAA..BAAAA\" is a base64-encoded signature that corresponds\
    \ to a marshaled CREDENTIAL_TARGET_INFORMATION structure.\nAttackers can use this\
    \ technique to coerce authentication from victim systems to attacker-controlled\
    \ hosts.\nIt is one of the strong indicators of a Kerberos coercion attack, where\
    \ adversaries manipulate DNS records\nto spoof Service Principal Names (SPNs)\
    \ and redirect authentication requests like in CVE-2025-33073.\nIf you see this\
    \ pattern in the command line, it is likely an attempt to add spoofed Service\
    \ Principal Names (SPNs) to DNS records,\nor checking for the presence of such\
    \ records through the `nslookup` command.\n [source: Sigma 0ed99dda-6a35-11ef-8c99-0242ac120002]"
  category: windows_command
  patterns:
  - (?=.*UWhRCA)(?=.*BAAAA)
  severity: high
  action: block
  mitre_atlas_id: attack.t1557.001
  enabled: true
  tags:
  - sigma
  - attack.collection
  - attack.credential-access
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1557.001
  - attack.t1187
