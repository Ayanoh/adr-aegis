    \ the 'tokens=' parameter and a recursive directory listing.\nThis pattern may\
    \ indicate an attempt to discover and execute system binaries dynamically, for\
    \ example powershell, a technique sometimes used by attackers to evade detection.\n\
    This behavior has been observed in various malicious lnk files.\n [source: Sigma\
    \ 2782fbd8-b662-4eb5-9962-5bfbfb671e7b]"
  category: windows_command
  patterns:
  - (?=.*for\ /f)(?=.*tokens=)(?=.*in\ \()(?=.*dir)
