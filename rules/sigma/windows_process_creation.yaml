    Defender|\bPowerShellCore\b|\bSecurity\b|Windows\ PowerShell))(?=.*(?:\-InstanceId\
    462.|\.eventid\ \-eq\ 462.|\.ID\ \-eq\ 462.|EventCode=.462.|EventIdentifier=.462.|System\[EventID=462.\]|\-InstanceId\
