- id: SIG-WIN-CMD-0519
  name: Obfuscated PowerShell MSI Install via WindowsInstaller COM
  description: "Detects the execution of obfuscated PowerShell commands that attempt\
    \ to install MSI packages via the Windows Installer COM object (`WindowsInstaller.Installer`).\n\
    The technique involves manipulating strings to hide functionality, such as constructing\
    \ class names using string insertion (e.g., 'indowsInstaller.Installer'.Insert(0,'W'))\
    \ and correcting\nmalformed URLs (e.g., converting 'htps://' to 'https://') at\
    \ runtime. This behavior is commonly associated with malware loaders or droppers\
    \ that aim to bypass static detection\nby hiding intent in runtime-generated strings\
    \ and using legitimate tools for code execution. The use of `InstallProduct` and\
    \ COM object creation, particularly combined with\nhidden window execution and\
    \ suppressed UI, indicates an attempt to install software (likely malicious) without\
    \ user interaction.\n [source: Sigma 7b6a7418-3afc-11f0-aff4-000d3abf478c]"
  category: windows_command
  patterns:
  - (?=.*(?:(?:\\powershell_ise\.exe|\\powershell\.exe|\\pwsh\.exe)|(?:PowerShell_ISE\.EXE|PowerShell\.EXE|pwsh\.dll)))(?=.*\-ComObject)(?=.*InstallProduct\()(?=.*\.Insert\()(?=.*UILevel).*
  severity: high
  action: block
  mitre_atlas_id: attack.t1027.010
  enabled: true
  tags:
  - sigma
  - attack.stealth
  - attack.t1027.010
  - attack.t1218.007
  - attack.execution
  - attack.t1059.001
- id: SIG-WIN-CMD-0520
  name: PowerShell MSI Install via WindowsInstaller COM From Remote Location
  description: "Detects the execution of PowerShell commands that attempt to install\
    \ MSI packages via the\nWindows Installer COM object (`WindowsInstaller.Installer`)\
    \ hosted remotely.\nThis could be indication of malicious software deployment\
    \ or lateral movement attempts using Windows Installer functionality.\nAnd the\
    \ usage of WindowsInstaller COM object rather than msiexec could be an attempt\
    \ to bypass the detection.\n [source: Sigma 222720a7-047f-4054-baa5-bab9be757db0]"
  category: windows_command
  patterns:
  - (?=.*(?:(?:\\powershell_ise\.exe|\\powershell\.exe|\\pwsh\.exe)|(?:PowerShell_ISE\.EXE|PowerShell\.EXE|pwsh\.dll)))(?=.*\-ComObject)(?=.*InstallProduct\()(?=.*(?:\bhttp\b|\\\\\\\\))(?=.*(?:://127\.0\.0\.1|://localhost)).*
  severity: medium
  action: ask
  mitre_atlas_id: attack.t1059.001
  enabled: true
  tags:
  - sigma
  - attack.execution
  - attack.stealth
  - attack.t1059.001
  - attack.t1218
  - attack.command-and-control
  - attack.t1105
