- id: SIG-WIN-CMD-1120
  name: Service Reconnaissance Via Wmic.EXE
  description: "An adversary might use WMI to check if a certain remote service is\
    \ running on a remote device.\nWhen the test completes, a service information\
    \ will be displayed on the screen if it exists.\nA common feedback message is\
    \ that \"No instance(s) Available\" if the service queried is not running.\nA\
    \ common error message is \"Node - (provided IP or default) ERROR Description\
    \ =The RPC server is unavailable\" if the provided remote host is unreachable\n\
    \ [source: Sigma 76f55eaa-d27f-4213-9d45-7b0e4b60bbae]"
  category: windows_command
  patterns:
  - (?=.*(?:\\WMIC\.exe|wmic\.exe))(?=.*\bservice\b)(?=.*(?:\bstopservice\b|\bstartservice\b))(?=.*(?:\bChange\b|\bCreate\b|\bDelete\b|\bPauseService\b|\bResumeService\b|\bSetSecurityDescriptor\b|\bStartService\b|\bStopService\b|\bUserControlService\b)).*
  severity: medium
