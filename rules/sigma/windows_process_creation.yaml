    \ IDs.\nThis technique is used by threat actors in order to extract sensitive\
    \ information from events logs such as usernames, IP addresses, hostnames, etc.\n\
    \ [source: Sigma beaa66d6-aa1b-4e3c-80f5-e0145369bfaf]"
