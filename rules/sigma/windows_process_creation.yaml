  - attack.stealth
  - attack.t1047
  - attack.t1220
  - attack.execution
  - attack.t1059.005
  - attack.t1059.007
- id: SIG-WIN-CMD-1128
  name: Registry Enumeration via WMI Stdregprov
  description: "Detects the usage of wmic.exe to enumerate or read Windows registry\
    \ via the WMI StdRegProv class read methods (EnumKey, EnumValues, GetStringValue,\
    \ etc.).\nWhile registry reads are common, attackers may use this technique to\
    \ perform reconnaissance and discover sensitive configuration values, credentials,\
    \ or installed software.\nThe use of WMI as an alternative to standard tools like\
    \ reg.exe can indicate an attempt to evade detection focused on traditional registry\
    \ query commands.\n [source: Sigma a0e417e2-2fa1-40da-b6d2-e094cd5e1191]"
  category: windows_command
  patterns:
  - (?=.*(?:\\wmic\.exe|wmic\.exe))(?=.*stdregprov)(?=.*call)(?=.*(?:\bCheckAccess\b|\bEnumKey\b|\bEnumValues\b|\bGetBinaryValue\b|\bGetDWORDValue\b|\bGetExpandedStringValue\b|\bGetMultiStringValue\b|\bGetQWORDValue\b|\bGetSecurityDescriptor\b|\bGetStringValue\b)).*.*
  severity: medium
  action: ask
  mitre_atlas_id: attack.t1047
  enabled: true
