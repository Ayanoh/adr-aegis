# Credential reconnaissance detection rules
# Detects attempts to locate sensitive credential files on the system

- id: ADR-CRED-001
  name: Credential File Reconnaissance
  description: Searches for cloud credentials, SSH keys, or password files
  category: credential_access
  patterns:
    # find/locate targeting credential directories
    - 'find\s+.*~?/?\.aws'
    - 'find\s+.*~?/?\.ssh'
    - 'find\s+.*~?/?\.gnupg'
    - 'find\s+.*-name\s+.*credentials'
    - 'find\s+.*-name\s+.*id_rsa'
    - 'find\s+.*-name\s+.*id_ed25519'
    - 'find\s+.*-name\s+.*\.pem'
    # ls/cat targeting credential paths
    - 'ls\s+(-la?\s+)?~?/?\.aws'
    - 'ls\s+(-la?\s+)?~?/?\.ssh'
    - 'cat\s+~?/?\.aws/credentials'
    - 'cat\s+~?/?\.ssh/id_'
    # Broad credential harvesting patterns
    - 'grep\s+.*password.*~?/?\.(bash|zsh)'
  severity: high
  action: block
  tags: ["mitre_t1552", "credential_access", "cloud_credentials", "ssh_keys"]
